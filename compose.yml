name: mcp-gateway
x-backend: &backend
  build:
    context: .
    target: runtime
  environment: &environment
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://gateway:gateway@postgres:5432/gateway}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    MASTER_KEY: ${MASTER_KEY:?Generate a Fernet key and set MASTER_KEY in .env}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:5173}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    THREAD_LIMIT: ${THREAD_LIMIT:-16}
    KEY_VERSION: ${KEY_VERSION:-1}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gateway]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    profiles: [setup]
  sync:
    <<: *backend
    command: [gateway, plugins, sync]
    depends_on:
      postgres: {condition: service_healthy}
    profiles: [setup]
  backend:
    <<: *backend
    command: [uvicorn, 'gateway.app:create_app', --factory, --host, 0.0.0.0, --port, '8000', --workers, '${WORKERS:-1}', --no-access-log]
    ports: ['8000:8000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: ${PUBLIC_URL:-http://localhost:8000}
    ports: ['5173:80']
volumes:
  postgres-data:
  redis-data:
