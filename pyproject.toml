[project]
name = "mcp-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "fastmcp==4.0.10",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.0",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.1",
    "typer==0.27.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gateway", "sdk/gateway_sdk"]

[project.scripts]
gateway = "gateway.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
